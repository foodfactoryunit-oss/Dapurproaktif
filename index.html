<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dapur Proaktif - Simulasi Asisten Chef</title>
<style>
:root{--ink:#5b3a29;--cream:#fff4dc;--red:#ff6b4a;--yellow:#ffd23f;--mint:#5ed0a0;--sky:#6cc5ff;--pink:#ff9ec4;--orange:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background-color:#fff4dc;
background-image:linear-gradient(90deg,rgba(255,107,74,.16) 50%,transparent 50%),linear-gradient(rgba(255,107,74,.16) 50%,transparent 50%);background-size:48px 48px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--red);border-bottom:5px solid var(--ink);color:#fff;flex:0 0 auto;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;text-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;gap:6px}
.aud{display:flex;gap:6px;flex-wrap:wrap}
.abtn{border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.abtn:active{transform:translateY(3px);box-shadow:none}
.abtn.off{background:#d9d9d9;color:#777}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 52px;scroll-behavior:smooth}
#foot{position:fixed;left:0;right:0;bottom:0;height:34px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.2px;z-index:200;padding:0 8px;text-align:center}
.wrap{max-width:900px;margin:0 auto}
.btn{font:inherit;font-weight:900;font-size:17px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:12px 24px;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(1) opacity(.6);cursor:not-allowed;transform:none;box-shadow:0 6px 0 var(--ink)}
.btn.sm{font-size:13px;padding:8px 12px;box-shadow:0 4px 0 var(--ink)}
.btn.green{background:var(--mint)}.btn.red{background:var(--red);color:#fff}
.card{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);overflow:hidden}
.card .body{padding:16px}
.ribbon{padding:10px 16px;font-weight:900;font-size:17px;border-bottom:4px solid var(--ink);background:var(--yellow)}
.ribbon.r2{background:var(--mint)}.ribbon.g{background:var(--mint)}.ribbon.y{background:var(--yellow)}.ribbon.r{background:var(--red);color:#fff}.ribbon.b{background:var(--sky)}
h1,h2,h3,h4{margin:0 0 8px}
p{margin:6px 0;line-height:1.45}
/* login */
.hero{text-align:center}
.hero .mascot{width:190px;height:210px;margin:0 auto;animation:bounce 1.1s ease-in-out infinite}
.title{font-size:clamp(30px,7vw,52px);font-weight:900;color:var(--red);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);margin:4px 0}
.sub{font-weight:700;max-width:520px;margin:4px auto 14px}
.form{max-width:440px;margin:0 auto;text-align:left}
.form label{display:block;font-weight:900;margin:10px 0 4px}
.form input{width:100%;font:inherit;font-weight:700;padding:12px 14px;border:4px solid var(--ink);border-radius:16px;background:#fffdf5;color:var(--ink);outline:none}
.form input:focus{background:#fff6bf}
.form .btn{width:100%;margin-top:16px}
.small{font-size:13px;opacity:.85}
/* intro */
.speakrow{display:flex;gap:12px;align-items:flex-start}
.speakrow .av{flex:0 0 auto;width:92px}
.tail{position:relative;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:12px 14px;font-weight:700}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.job{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--ink);position:relative;animation:popIn .5s both}
.job:nth-child(1){transform:rotate(-1.5deg);background:#fff1b8}.job:nth-child(2){transform:rotate(1deg);background:#d6f5e6}.job:nth-child(3){transform:rotate(-1deg);background:#d9eeff}
.job .n{position:absolute;top:-16px;left:-10px;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;border:4px solid var(--ink);display:grid;place-items:center;font-weight:900}
.job .ic{font-size:34px}
.how{background:#fff;border:4px dashed var(--ink);border-radius:18px;padding:10px 14px;font-weight:700;margin:10px 0}
/* play */
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.badge.ph{background:var(--yellow)}.badge.ph.open{background:var(--orange);color:#fff}
.obj{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:800;font-size:14px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.obj .dot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;flex:0 0 auto}
.stage{position:relative;border:5px solid var(--ink);border-radius:28px;overflow:hidden;height:clamp(280px,50vh,460px);background:#fff;box-shadow:0 8px 0 var(--ink)}
.scene{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.scene.walking{animation:walkSwap .75s ease-in-out}
.hands{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:min(520px,100%);pointer-events:none}
.stage.walkmode .hands{animation:handsBob .22s ease-in-out 4}
.hands.reach{animation:reach .45s ease-out}
.spotname{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink)}
.bubble{position:absolute;top:10px;right:10px;max-width:min(62%,360px);background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;animation:popIn .35s both;z-index:3}
.bubble b{color:var(--red)}
.hot{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:4;font:inherit;font-weight:900;font-size:16px;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:11px 20px;box-shadow:0 6px 0 var(--ink);cursor:pointer;animation:hotPulse 1s ease-in-out infinite;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-weight:800;font-size:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 8px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip.here{background:var(--sky)}
.chip.glow,.btn.glow{animation:hotPulse 1s infinite}
#dlg .card{margin-top:14px}
.opts{margin-top:8px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;font:inherit;font-weight:800;font-size:15px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.opt:hover{background:#fff3b0}.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .l{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--sky);border:3px solid var(--ink);display:grid;place-items:center;font-size:13px}
/* modal */
#modal{position:fixed;left:0;right:0;top:0;bottom:34px;background:rgba(91,58,41,.62);display:none;padding:12px;z-index:150;overflow:auto}
#modal.on{display:flex}
#modal>.pop{margin:auto}
.pop{max-width:560px;width:100%;animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
.pop.wide{max-width:880px}
.situ{background:#fff8dd;border:3px dashed var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.situ .em{font-size:30px}
.big{font-size:46px;text-align:center;margin:4px 0}
.center{text-align:center}
/* paper zoom */
.zoomwrap{perspective:900px}
.paper{position:relative;background:#fffef6;border:4px solid var(--ink);border-radius:8px;padding:20px 18px 16px;margin:14px auto;max-width:420px;box-shadow:0 8px 0 rgba(91,58,41,.35);transform:rotate(-1.5deg);animation:zoomIn .6s cubic-bezier(.2,1.3,.4,1);background-image:repeating-linear-gradient(transparent 0 29px,#d7ecff 29px 31px)}
.paper .tape{position:absolute;top:-14px;left:50%;width:90px;height:26px;margin-left:-45px;background:rgba(255,210,63,.85);border:3px solid var(--ink);transform:rotate(3deg)}
.paper h3{font-size:22px;margin:4px 0}
.paper .ln{font-weight:800;font-size:17px;margin:8px 0}
.paper .ln.hand{font-family:"Comic Sans MS","Segoe Print",cursive}
.paper .note{margin-top:12px;border:3px dashed var(--red);border-radius:12px;padding:8px 10px;font-weight:900;cursor:pointer;background:#fff;position:relative;font-family:"Comic Sans MS","Segoe Print",cursive}
.paper .note.marked{background:linear-gradient(transparent 20%,#fff176 20%);border-style:solid;animation:wiggleX .4s}
.hint{font-size:13px;font-weight:700;text-align:center;opacity:.85}
/* mix */
.mixgrid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
@media(max-width:700px){.mixgrid{grid-template-columns:1fr}.speakrow .av{width:70px}}
.recipe{background:#fff8dd;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;transform:rotate(-.8deg)}
.recipe ol{margin:6px 0;padding-left:20px}.recipe li{margin:4px 0}
.cat{margin-top:8px;background:#ffe1dc;border:3px dashed var(--red);border-radius:12px;padding:6px 8px;font-weight:900}
.ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ingc{font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 6px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.ingc .e{font-size:28px}
.ingc.sel{background:var(--sky);transform:translateY(3px) rotate(-2deg);box-shadow:0 1px 0 var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.res{display:grid;gap:8px;margin:10px 0}
.rg{border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-weight:700;font-size:14px}
.rg.ok{background:#d6f5e6}.rg.no{background:#ffe1dc}.rg.miss{background:#fff1b8}
.rg b{display:block;margin-bottom:2px}
.chefline{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.chefline svg{flex:0 0 auto}
/* recap */
.stat{margin:10px 0}.stat .row{display:flex;justify-content:space-between;font-weight:900;gap:8px}
.bar{height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--yellow));width:0;transition:width 1.2s cubic-bezier(.2,1,.3,1)}
.idrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.idrow span{background:#fff8dd;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:800}
.fw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.fw .card .body{padding:12px 14px;font-size:14px;font-weight:600}
.ooda{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.ooda div{border:3px solid var(--ink);border-radius:14px;padding:8px;font-size:13px;font-weight:700}
.ooda div:nth-child(1){background:#d9eeff}.ooda div:nth-child(2){background:#fff1b8}.ooda div:nth-child(3){background:#ffe1dc}.ooda div:nth-child(4){background:#d6f5e6}
.closing{background:linear-gradient(135deg,#fff1b8,#ffd9e5);border:4px solid var(--ink);border-radius:24px;padding:16px;box-shadow:0 7px 0 var(--ink);margin:14px 0;font-weight:700}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.fxi{position:absolute;font-size:34px;animation:fxUp 1.3s ease-out forwards}
.shake{animation:shake .45s}
/* svg anims */
.o{stroke:#5b3a29;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.bn{animation:bounce 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bn.d2{animation-delay:.3s}.bn.d3{animation-delay:.6s}
.wg{animation:wiggle 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:swing 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
.sw.d2{animation-delay:.5s}.sw.d3{animation-delay:1s}
.fl{animation:flame .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
.toss{animation:toss .6s ease-in-out 3;transform-box:fill-box;transform-origin:center}
.fly{animation:fly .6s ease-out 3;opacity:0}
.spk{animation:twinkle 1s ease-in-out infinite}.spk.d2{animation-delay:.4s}
.qm{animation:bounce .9s ease-in-out infinite}
.drop{animation:dropAnim 1.1s ease-in infinite}
.dots{animation:bounce .8s ease-in-out infinite}
.cb{animation:custBob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.wave{animation:wave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.steam{animation:steam 2s ease-in infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(1.04,.96)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wiggleX{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes flame{from{transform:scale(.9,.85)}to{transform:scale(1.1,1.15)}}
@keyframes toss{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(-4px) rotate(5deg)}}
@keyframes fly{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-90px) translateX(var(--dx,10px));opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.2);opacity:1}}
@keyframes dropAnim{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes custBob{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-6px) rotate(.8deg)}}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-40px);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes zoomIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-1.5deg);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes hotPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
.chip.glow,.btn.sm.glow{animation:hotPulse2 1s infinite}
@keyframes hotPulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes walkSwap{0%{transform:translateX(0) scale(1)}45%,55%{transform:translateX(calc(var(--dir,1)*-7%)) scale(1.2);opacity:.15}100%{transform:translateX(0) scale(1);opacity:1}}
@keyframes handsBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-14px)}}
@keyframes reach{0%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-46px) scale(1.06)}100%{transform:translateX(-50%) translateY(0)}}
@keyframes fxUp{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-180px) scale(1.3) rotate(var(--rot));opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media(max-width:560px){.logo{font-size:15px}.hot{font-size:14px;padding:9px 14px}.chip .t{display:none}.btn{font-size:15px}.bubble{font-size:12.5px;max-width:70%}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">🍳 Dapur Proaktif</div>
    <div class="aud">
      <button class="abtn" id="bMusic" type="button" aria-label="Musik latar">🎵 Musik: ON</button>
      <button class="abtn" id="bSfx" type="button" aria-label="Efek suara">🔊 Efek Suara: ON</button>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div id="modal"></div>
<div id="fx"></div>
<footer id="foot">Education &amp; Training Department - Food Beverage Industry (2026)</footer>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ================= AUDIO (Web Audio API, tanpa file eksternal) ================= */
var EIGHTH=60/132/2;
var AU={ctx:null,music:true,sfx:true,timer:null,step:0,next:0,
 init:function(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  var c=this.ctx=new C();
  this.master=c.createGain();this.master.gain.value=.9;this.master.connect(c.destination);
  this.bgmG=c.createGain();this.bgmG.gain.value=this.music?.22:0;this.bgmG.connect(this.master);
  this.sfxG=c.createGain();this.sfxG.gain.value=this.sfx?.7:0;this.sfxG.connect(this.master);
  var b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
  if(this.music)this.startBgm();
 },
 _tone:function(f,d,type,v,t,dest,slide){
  var c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)},
 _noise:function(d,v,fq,t,dest,type){
  var c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type=type||'highpass';f.frequency.value=fq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.02)},
 tone:function(f,d,type,v,delay,slide){if(!this.ctx||!this.sfx)return;this._tone(f,d,type,v,this.ctx.currentTime+(delay||0),this.sfxG,slide)},
 noise:function(d,v,fq,delay,type){if(!this.ctx||!this.sfx)return;this._noise(d,v,fq,this.ctx.currentTime+(delay||0),this.sfxG,type)},
 startBgm:function(){if(!this.ctx||this.timer)return;var s=this;this.next=this.ctx.currentTime+.1;this.timer=setInterval(function(){s.sched()},60)},
 stopBgm:function(){clearInterval(this.timer);this.timer=null},
 sched:function(){while(this.next<this.ctx.currentTime+.25){this.play(this.step,this.next);this.next+=EIGHTH;this.step=(this.step+1)%32}},
 play:function(s,t){
  var bar=Math.floor(s/8)%4,pos=s%8,f=function(n){return 261.63*Math.pow(2,n/12)},g=this.bgmG;
  var ROOT=[-12,-15,-19,-17],BP=[0,null,12,null,0,null,7,null];
  var MEL=[[16,null,12,16,19,null,16,12],[9,null,12,16,21,null,16,12],[17,null,12,17,21,null,17,12],[19,null,14,19,23,null,19,14]];
  var CH=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
  if(BP[pos]!==null)this._tone(f(ROOT[bar]+BP[pos]),.2,'triangle',.5,t,g);

  S.pre.push(s);if(s===2)S.flags['pre'+st.i]=true;
  S.chefExpr=s===2?'happy':s===1?'confused':'upset';
  SFX[VERD[s].sf]();burst(VERD[s].fx);
  $('#modal .card').innerHTML=verdictView(s,o.fb);
  $('#nx').onclick=function(){SFX.click();closeModal();advance()}}}
function doPaper(st){
 var o=ORD[st.o];S.busy=true;updateUI();SFX.paper();
 openModal('<div class="pop"><div class="card"><div class="ribbon b">🔍 Zoom Kertas Pesanan</div><div class="body"><div class="speakrow"><div class="av" style="width:60px">'+avatar('chef','normal',60)+'</div><div class="tail" style="font-size:14px"><b>Chef Bima:</b> '+esc(fn())+', baca pelan-pelan ya. Detailnya sering ada di catatan.</div></div>'+
 '<div class="zoomwrap"><div class="paper"><div class="tape"></div><h3>PESANAN No. '+('0'+o.no)+'</h3><div class="ln hand">'+o.meja+' · Makan di tempat</div><div class="ln">'+o.emoji+' '+o.dish+' x'+o.qty+'</div><div class="ln hand">Tambahan: '+o.extra+'</div><div class="note" id="note">⚠ CATATAN KHUSUS: '+o.note+'</div></div></div>'+
 '<p class="hint">🖍️ Ketuk catatan khusus untuk menyorotnya dengan stabilo.</p><div class="center"><button class="btn" id="go" disabled>Sudah kubaca →</button></div></div></div></div>');
 $('#note').onclick=function(){if(this.classList.contains('marked'))return;this.classList.add('marked');SFX.pick();SFX.paper();$('#go').disabled=false;reach()};
 $('#go').onclick=function(){SFX.click();closeModal();S.flags['paper'+st.o]=true;advance()}}
function doMix(st){
 var o=ORD[st.o];S.busy=true;updateUI();SFX.pop();
 var items=shuffle(o.ing),sel={};
 openModal('<div class="pop card wide"><div class="ribbon r2">🥘 Siapkan Bahan · Pesanan No. '+('0'+o.no)+'</div><div class="body"><div class="chefline">'+avatar('chef','normal',56)+'<div class="tail" style="flex:1"><b>Chef Bima:</b> '+esc(fn())+', '+o.chef+'</div></div>'+
 '<div class="mixgrid"><div class="recipe"><h4>📖 Panduan Resep: '+o.dish+'</h4><ol>'+o.guide.map(function(g){return '<li>'+g+'</li>'}).join('')+'</ol><div class="cat">📌 Catatan pesanan: '+o.note+'</div></div>'+
 '<div><p class="hint" style="text-align:left">Pilih bahan yang perlu disiapkan. Rak ini campur, tidak semuanya cocok.</p><div class="ing" id="ing">'+items.map(function(it,i){return '<button class="ingc" data-i="'+i+'"><span class="e">'+it.e+'</span>'+it.n+'</button>'}).join('')+'</div></div></div>'+
 '<div class="foot"><span id="cnt" class="badge">Dipilih: 0</span><button class="btn" id="send" disabled>Kirim ke Chef 🍳</button></div></div></div>');
 var bs=$('#ing').querySelectorAll('.ingc');
 for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var k=this.getAttribute('data-i');if(sel[k]){delete sel[k];this.classList.remove('sel');SFX.unpick()}else{sel[k]=1;this.classList.add('sel');SFX.pick()}reach();var n=Object.keys(sel).length;$('#cnt').textContent='Dipilih: '+n;$('#send').disabled=n===0};
 $('#send').onclick=function(){
  SFX.click();
  var T=0,c=0,w=0,okL=[],noL=[],miss=[];
  items.forEach(function(it,i){if(it.ok)T++;if(sel[i]){if(it.ok){c++;okL.push(it)}else{w++;noL.push(it)}}else if(it.ok)miss.push(it)});
  var ratio=Math.max(0,c-w)/T;S.mat.push(ratio);
  var lvl=ratio>=.99?2:ratio>=.5?1:0;
  S.dish=o.emoji;S.wokToss=true;S.chefExpr=lvl===2?'happy':lvl===1?'confused':'upset';
  if(lvl===2)S.flags['mix'+st.o]=true;
  SFX.sizzle();setTimeout(function(){SFX[VERD[lvl].sf]()},500);burst(VERD[lvl].fx);
  var title=lvl===2?'Bahan pas semua! ⭐':lvl===1?'Hampir pas, tapi masih ada yang meleset':'Waduh, banyak bahan yang meleset';
  var quote=lvl===2?'Mantap, '+esc(fn())+'! Semua pas, aku tinggal masak. Rapi banget.':lvl===1?'Hmm '+esc(fn())+', ada yang kurang atau nyasar. Lain kali cek lagi catatan dan resepnya sebelum kirim.':esc(fn())+', ini bahannya banyak yang tidak sesuai catatan. Baca kertas dan resep dulu, baru ambil bahan, ya.';
  var h='<div class="ribbon '+VERD[lvl].c+'">'+title+'</div><div class="body"><div class="chefline">'+avatar('chef',S.chefExpr,60)+'<div class="tail" style="flex:1"><b>Chef Bima:</b> '+quote+'</div></div><div class="res">';
  if(okL.length)h+='<div class="rg ok"><b>✔ Tepat dipilih ('+okL.length+')</b>'+okL.map(function(x){return x.e+' '+x.n}).join(' · ')+'</div>';
  if(noL.length)h+='<div class="rg no"><b>✖ Tidak nyambung ('+noL.length+')</b>'+noL.map(function(x){return x.e+' '+x.n+': '+x.why}).join('<br>')+'</div>';
  if(miss.length)h+='<div class="rg miss"><b>⚠ Terlewat ('+miss.length+')</b>'+miss.map(function(x){return x.e+' '+x.n}).join(' · ')+'</div>';
  h+='</div><div class="center"><button class="btn green" id="nx">Lanjut ke konter →</button></div></div>';
  $('#modal .card').innerHTML=h;drawScene();
  setTimeout(function(){S.wokToss=false},2000);
  $('#nx').onclick=function(){SFX.click();closeModal();advance()}}}
function doServe(st){
 var o=st.o,q=CQ[o],c=CUST[o];S.busy=true;S.custExpr='wait';S.served=false;SFX.pop();drawScene();hideBub();
 setTimeout(function(){say(c.n,subst(q.say))},150);
 var opts=shuffle(q.opts),L=['A','B','C','D'];
 $('#dlg').innerHTML='<div class="card"><div class="ribbon b">🙋 Layani '+c.n+' · Kamu jawab apa?</div><div class="body"><div class="opts">'+opts.map(function(x,i){return '<button class="opt" data-i="'+i+'"><span class="l">'+L[i]+'</span><span>'+x.t+'</span></button>'}).join('')+'</div></div></div>';
 var bs=$('#dlg').querySelectorAll('.opt');
 for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
  var x=opts[+this.getAttribute('data-i')],s=x.s;SFX.click();reach();
  S.cs.push(s);S.custExpr=s===2?'happy':s===1?'confused':'upset';S.chefExpr=s===2?'happy':'normal';S.served=s===2;
  drawScene();say(c.n,x.rep);SFX[VERD[s].sf]();burst(VERD[s].fx);
  if(s===2)setTimeout(function(){SFX.bell()},500);
  var chefNote=s===2?'Chef melihatmu sigap, jadi langsung plating dan piring meluncur ke konter. Ritme kerja kalian solid. 🍽️':'Chef menunggu kepastian darimu sebelum plating, jadi alur dapur ikut tersendat.';
  $('#dlg').innerHTML='<div class="card"><div class="ribbon '+VERD[s].c+'">'+VERD[s].t+'</div><div class="body"><p>'+x.fb+'</p><p><b>👨‍🍳 Alur dapur:</b> '+chefNote+'</p><div class="center"><button class="btn green" id="nx">'+(o<2?'Pesanan berikutnya →':'Selesaikan shift 🎉')+'</button></div></div></div>';
  $('#nx').onclick=function(){SFX.click();$('#dlg').innerHTML='';hideBub();S.custExpr='wait';S.chefExpr='normal';S.served=false;S.dish=null;if(o<2)S.cur=o+1;advance()}}}

/* ================= REKAP ================= */
function pctOf(a,max){return Math.round(a/max*100)}
function stars(p){var n=p>=80?3:p>=50?2:1;var s='';for(var i=0;i<3;i++)s+=i<n?'⭐':'☆';return s}
function recapStat(label,p,note){return '<div class="stat"><div class="row"><span>'+label+'</span><span>'+stars(p)+' '+p+'%</span></div><div class="bar"><i data-w="'+p+'"></i></div><p class="small">'+note+'</p></div>'}
function screenRecap(){
 var pre=S.pre.reduce(function(a,b){return a+b},0),cs=S.cs.reduce(function(a,b){return a+b},0),mat=S.mat.reduce(function(a,b){return a+b},0);
 var pP=pctOf(pre,6),pM=Math.round(mat/3*100),pC=pctOf(cs,6),tot=Math.round((pP+pM+pC)/3);
 var title=tot>=80?'Asisten Chef Andalan 🏆':tot>=55?'Asisten Chef Sigap 👍':'Asisten Chef Calon Handal 🌱';
 var nP=pP>=80?'Kamu menyiapkan sebelum diminta. Itu kebiasaan yang membuat dapur terasa ringan.':pP>=50?'Sudah ada inisiatif, tinggal lebih sering melangkah sebelum disuruh.':'Masih sering menunggu aba-aba. Coba mulai dari satu hal kecil yang bisa kamu siapkan lebih dulu.';
 var nM=pM>=80?'Kertas pesanan dan resep kamu baca dengan teliti. Bahan yang disiapkan pas dengan catatan.':pM>=50?'Cukup teliti, tapi masih ada bahan yang terlewat atau nyasar. Catatan khusus layak dibaca dua kali.':'Bahan banyak yang meleset dari catatan. Biasakan membaca kertas dan resep sebelum mengambil bahan.';
 var nC=pC>=80?'Jawabanmu jelas, konkret, dan selaras dengan alur Chef. Pelanggan pulang tersenyum.':pC>=50?'Pelayananmu sopan. Tambahkan kepastian (waktu, catatan) supaya pelanggan makin yakin.':'Jawaban masih sering menggantung. Pelanggan butuh kepastian, bukan sekadar basa-basi.';
 var tag=function(p){return p>=80?'kuat':p>=50?'cukup':'perlu diasah'};
 show('<div class="wrap"><div class="center"><div style="width:130px;margin:0 auto">'+avatar('chef',tot>=55?'happy':'normal',130)+'</div><div class="title" style="font-size:clamp(26px,6vw,42px)">Rapor Shift Dapur</div></div>'+
 '<div class="card"><div class="ribbon">🧾 Evaluasi Akhir · '+title+'</div><div class="body"><div class="idrow"><span>👤 Nama: '+esc(P.name)+'</span><span>🪪 NIK: '+esc(P.nik)+'</span><span>⭐ Total: '+tot+'%</span></div>'+
 recapStat('🌅 Kesiapan & Langkah Proaktif',pP,nP)+recapStat('📝 Ketelitian Bahan & Kertas Pesanan',pM,nM)+recapStat('🙋 Pelayanan Pelanggan',pC,nC)+'</div></div>'+
 '<h2 style="margin-top:20px">🧠 Kaitan dengan Materi</h2><div class="fw">'+
 '<div class="card"><div class="ribbon y">🎯 Sikap Proaktif (Covey)</div><div class="body">Orang proaktif mengambil inisiatif sebelum diminta dan fokus pada <b>Circle of Influence</b>, yaitu hal-hal yang bisa dia kerjakan sendiri. Di dapur tadi, menghitung stok, menyiapkan bumbu, dan membaca resep lebih awal adalah contohnya. Area ini kamu: <b>'+tag(pP)+'</b>.</div></div>'+
 '<div class="card"><div class="ribbon g">🤝 Inisiatif & Keteladanan</div><div class="body">Inisiatif yang lahir dari dalam diri membangun ritme kerja yang solid bersama Chef dan pelayanan yang meyakinkan. Saat kamu sigap dan jelas, rekan dan pelanggan jadi percaya, dan itu menular ke tim. Pelayananmu: <b>'+tag(pC)+'</b>.</div></div></div>'+
 '<div class="card"><div class="ribbon b">🔄 OODA Loop (John Boyd)</div><div class="body">Siklus berpikir dan bertindak cepat yang tadi kamu jalani di dapur:<div class="ooda">'+
 '<div><b>👀 Observe</b><br>Melihat detail resep, kertas pesanan, dan ekspresi situasi.<br><i>Ketelitianmu: '+tag(pM)+'</i></div>'+
 '<div><b>🧭 Orient</b><br>Memetakan kecocokan bahan dengan kebutuhan Chef dan pelanggan.<br><i>Pemetaan bahan: '+pM+'%</i></div>'+
 '<div><b>🎯 Decide</b><br>Menentukan bahan dan respons yang tepat.<br><i>Keputusan layanan: '+pC+'%</i></div>'+
 '<div><b>⚡ Act</b><br>Mengeksekusi dengan sigap, sebelum diminta.<br><i>Langkah proaktif: '+pP+'%</i></div></div></div></div>'+
 '<div class="closing"><h3>💌 Pesan Penutup</h3><p>'+esc(fn())+', dapur yang hebat tidak lahir dari satu Chef yang pintar saja, tapi dari tim yang saling peka. Setiap kali kamu membaca satu catatan lebih teliti, menyiapkan satu bahan lebih awal, atau menjawab pelanggan dengan jelas, kamu sedang membangun kepercayaan.</p><p>Mulailah dari hal kecil yang ada dalam jangkauanmu. Tidak perlu menunggu disuruh: lihat, pahami, putuskan, lalu lakukan. Terima kasih sudah menjadi bagian dari dapur ini. Besok, buat Chef dan pelanggan tersenyum lagi. 🍳💛</p></div>'+
 '<div class="center" style="margin:16px 0"><button class="btn" id="again">Ulangi Simulasi 🔁</button></div></div>');
 SFX.fanfare();burst('good');
 setTimeout(function(){var bs=document.querySelectorAll('.bar i');for(var i=0;i<bs.length;i++)bs[i].style.width=bs[i].getAttribute('data-w')+'%'},150);
 $('#again').onclick=function(){SFX.click();resetState();screenPlay()}}

screenLogin();
})();
</script>
